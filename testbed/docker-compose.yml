version: '3.8'

services:
  vpn-server:
    build: 
      context: .
      dockerfile: Dockerfile.strongswan
    container_name: vpn-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./runtime/configs/server/swanctl.conf:/etc/swanctl/swanctl.conf:ro
    command: ["/usr/local/bin/start-server-workloads"]
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-sas >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      vpn-net:
        ipv4_address: 10.0.0.2
        ipv6_address: fd00::2

  vpn-client:
    build:
      context: .
      dockerfile: Dockerfile.strongswan
    container_name: vpn-client
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./runtime/configs/client/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./scripts:/scripts:ro
    networks:
      vpn-net:
        ipv4_address: 10.0.0.3
        ipv6_address: fd00::3
    # Start charon in background, then we can run traffic generators
    # Actually, we can just run charon and use docker exec for traffic.
    command: ["charon"]
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-sas >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  sniffer:
    image: nicolaka/netshoot
    container_name: vpn-sniffer
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Attach directly to the client's network stack to capture the exact packets
    # before and after ESP encryption.
    network_mode: "service:vpn-client"
    volumes:
      - ./runtime/pcaps:/pcaps
    # We will trigger the tcpdump command via docker exec in the orchestrator, 
    # but we need the container to stay alive.
    command: ["sleep", "infinity"]
    depends_on:
      vpn-client:
        condition: service_healthy

networks:
  vpn-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
        - subnet: fd00::/64
