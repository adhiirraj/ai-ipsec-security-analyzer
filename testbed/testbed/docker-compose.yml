version: "3.8"

services:
  vpn-server:
    build:
      context: .
      dockerfile: Dockerfile.strongswan
    container_name: vpn-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/server/swanctl.conf:/etc/swanctl/swanctl.conf:ro
    networks:
      vpn-net:
        ipv4_address: 10.0.0.2

  vpn-client:
    build:
      context: .
      dockerfile: Dockerfile.strongswan
    container_name: vpn-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/client/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./scripts:/scripts:ro
    networks:
      vpn-net:
        ipv4_address: 10.0.0.3
    command: ["/usr/lib/strongswan/charon"]

  sniffer:
    image: nicolaka/netshoot
    container_name: vpn-sniffer
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "service:vpn-client"
    volumes:
      - ./pcaps:/pcaps
    command: ["sleep", "infinity"]
    depends_on:
      - vpn-client

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
