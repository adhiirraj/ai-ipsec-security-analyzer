connections {
    rw {
        local_addrs  = 10.0.0.2
        
        local {
            auth = psk
            id = server.vpn.local
        }
        remote {
            auth = psk
            id = client.vpn.local
        }
        
        children {
            net {
                local_ts  = 10.0.0.2/32
                remote_ts = 10.0.0.3/32
                
                # Jinja2 variables for ESP proposals and mode
                esp_proposals = aes256-sha256-ecp256
                mode = tunnel
            }
        }
        
        version = 2
        proposals = aes256gcm16-sha256-ecp256
    }
}

secrets {
    ike-psk {
        id-server = server.vpn.local
        id-client = client.vpn.local
        secret = "HackathonSecretKey2026"
    }
}
