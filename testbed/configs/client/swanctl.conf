connections {
    gw {
        remote_addrs = 10.0.0.2
        local_addrs  = 10.0.0.3
        
        local {
            auth = psk
            id = client.vpn.local
        }
        remote {
            auth = psk
            id = server.vpn.local
        }
        
        children {
            net {
                local_ts  = 10.0.0.3/32
                remote_ts = 10.0.0.2/32
                
                esp_proposals = aes128ctr
                mode = tunnel
            }
        }
        
        version = 2
        proposals = 3des-sha1-modp1024
    }
}

secrets {
    ike-psk {
        id-client = client.vpn.local
        id-server = server.vpn.local
        secret = "HackathonSecretKey2026"
    }
}
