[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsec-sentinel-ai"
version = "0.1.0"
description = "Streaming IPsec PCAP analysis and transparent security assessment"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "IPsec-Sentinel-AI contributors" }]
dependencies = []

[project.optional-dependencies]
protocol = [
  "scapy>=2.5.0",
]
data = [
  "pydantic>=2.7,<3",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]
dashboard = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]
simulator = [
  "cryptography>=42",
]
all = [
  "cryptography>=42",
  "fastapi>=0.110,<1",
  "joblib>=1.3",
  "pandas>=2.2",
  "pydantic>=2.7,<3",
  "scapy>=2.5.0",
  "scikit-learn>=1.4",
  "uvicorn>=0.27,<1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "httpx>=0.27",
]

[project.scripts]
ipsec-sentinel = "ipsec_sentinel.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires Docker, strongSwan, and NET_ADMIN; opt in explicitly",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
