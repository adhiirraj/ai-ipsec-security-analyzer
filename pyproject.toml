[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsec-sentinel-ai"
version = "0.1.0"
description = "Streaming IPsec PCAP analysis and transparent security assessment"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "IPsec-Sentinel-AI contributors" }]
dependencies = []

[project.optional-dependencies]
protocol = [
  "scapy>=2.5.0",
]
data = [
  "pydantic>=2.7,<3",
  "pandas>=2.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
ipsec-sentinel = "ipsec_sentinel.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
