name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all declared dependencies (editable + all extras + dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all,dev]"

      - name: Syntax check – compile all Python sources
        run: >
          python -m compileall -q
          src dashboard/backend testbed aes_ctr
          aes_ctr_ipsec.py pcap_generation_automated.py

      - name: Ruff lint (errors, format, imports)
        run: python -m ruff check src dashboard/backend testbed tests

      - name: Unit tests (no Docker, no network)
        run: python -m pytest -m "not integration" -v
