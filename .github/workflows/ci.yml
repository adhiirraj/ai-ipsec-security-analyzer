name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src dashboard testbed aes_ctr aes_ctr_ipsec.py pcap_generation_automated.py
      - run: python -m ruff check src dashboard/backend testbed tests
      - run: python -m pytest -m "not integration"
